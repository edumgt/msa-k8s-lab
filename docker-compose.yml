networks:
  microservices-net:
    driver: bridge
  shared-net:
    external: true


services:
  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - microservices-net
    healthcheck:
      test: [ "CMD", "wget", "--spider","-q", "http://localhost:8761" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "9901:9999"
    networks:
      - microservices-net
    depends_on:
      eureka-server:
        condition: service_healthy
    restart: always

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "5173:80"
    networks:
      - microservices-net
    depends_on:
      - api-gateway
    restart: always

  auth-service:
    build: ./oauth
    container_name: auth-service
    ports:
      - "8081:8081"
    environment:
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-dummy-client-id}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-dummy-client-secret}
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/chat-app-users
      APP_AUTH_SUCCESS_REDIRECT_URI: http://localhost:5173
      APP_OAUTH_REDIRECT_URI: http://localhost:9901/auth/login/oauth2/code/google
    networks:
      - microservices-net
      - shared-net
    depends_on:
      eureka-server:
        condition: service_healthy
    restart: always

  chat-service:
    build: ./chat-service
    container_name: chat-service
    ports:
      - "8082:8082"
    environment:
      APP_WEBSOCKET_REDIS_ENABLED: "true"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/chat-app-messages
    networks:
      - microservices-net
      - shared-net
    depends_on:
      eureka-server:
        condition: service_healthy
    restart: always

  profile-service:
    build: ./profile-service
    container_name: profile-service
    ports:
      - "18083:8083"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/chat-app-profiles
    networks:
      - microservices-net
      - shared-net
    depends_on:
      eureka-server:
        condition: service_healthy
    restart: always

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    ports:
      - "19090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - microservices-net
    depends_on:
      - eureka-server
      - api-gateway
      - auth-service
      - chat-service
      - profile-service
    restart: always
