<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 · Real Time Chat</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@latest/dist/web/static/pretendard.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            font-size: 17px;
            line-height: 1.6;
            color: #111827;
            background: #f5f6f8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .page-wrap {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }

        /* Left panel */
        .panel-left {
            display: none;
            flex: 1;
            background: #ffffff;
            border-right: 1px solid #e8eaed;
            flex-direction: column;
            justify-content: center;
            padding: 60px 56px;
        }
        @media (min-width: 960px) { .panel-left { display: flex; } }

        .brand-mark {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 52px;
        }
        .brand-mark .icon {
            width: 36px;
            height: 36px;
            background: #2563eb;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .brand-mark .icon svg { width: 20px; height: 20px; fill: #fff; }
        .brand-mark .name {
            font-size: 18px;
            font-weight: 700;
            color: #111827;
            letter-spacing: -0.3px;
        }

        .panel-left h2 {
            font-size: 32px;
            font-weight: 800;
            color: #111827;
            letter-spacing: -0.5px;
            line-height: 1.25;
            margin-bottom: 16px;
        }
        .panel-left p {
            font-size: 17px;
            color: #6b7280;
            line-height: 1.7;
            max-width: 380px;
        }

        .feature-list {
            margin-top: 44px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .feature-item {
            display: flex;
            align-items: flex-start;
            gap: 14px;
        }
        .feature-item .dot {
            margin-top: 4px;
            flex-shrink: 0;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #eff6ff;
            border: 1.5px solid #bfdbfe;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .feature-item .dot::after {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #2563eb;
        }
        .feature-item span {
            font-size: 16px;
            color: #374151;
            font-weight: 500;
        }

        /* Right panel / login card */
        .panel-right {
            flex: 0 0 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
            background: #f5f6f8;
        }
        @media (min-width: 960px) {
            .panel-right {
                flex: 0 0 480px;
                background: #f5f6f8;
            }
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 20px;
            padding: 44px 40px;
            box-shadow: 0 1px 4px rgba(0,0,0,.04), 0 8px 32px rgba(0,0,0,.07);
        }

        .card-header {
            margin-bottom: 32px;
        }
        .card-header .tag {
            display: inline-block;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #2563eb;
            background: #eff6ff;
            border-radius: 6px;
            padding: 3px 10px;
            margin-bottom: 14px;
        }
        .card-header h1 {
            font-size: 26px;
            font-weight: 800;
            color: #111827;
            letter-spacing: -0.4px;
            margin-bottom: 6px;
        }
        .card-header p {
            font-size: 15px;
            color: #6b7280;
        }

        /* Error */
        .error-box {
            margin-bottom: 20px;
            padding: 12px 16px;
            border-radius: 10px;
            background: #fef2f2;
            border: 1px solid #fecaca;
            font-size: 15px;
            color: #b91c1c;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .error-box::before {
            content: '⚠';
            font-size: 16px;
        }

        /* Form */
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 7px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            font-family: 'Pretendard', sans-serif;
            font-size: 16px;
            color: #111827;
            background: #f9fafb;
            border: 1.5px solid #e5e7eb;
            border-radius: 10px;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
        }
        .form-group input::placeholder { color: #9ca3af; }
        .form-group input:focus {
            background: #fff;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,.12);
        }

        .btn-primary {
            display: block;
            width: 100%;
            margin-top: 8px;
            padding: 13px;
            font-family: 'Pretendard', sans-serif;
            font-size: 17px;
            font-weight: 700;
            color: #fff;
            background: #2563eb;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            letter-spacing: -0.2px;
        }
        .btn-primary:hover { background: #1d4ed8; transform: translateY(-1px); }
        .btn-primary:active { transform: translateY(0); }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 24px 0;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e5e7eb;
        }
        .divider span {
            font-size: 13px;
            color: #9ca3af;
            font-weight: 500;
            white-space: nowrap;
        }

        /* Google button */
        .btn-google {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 12px;
            font-family: 'Pretendard', sans-serif;
            font-size: 16px;
            font-weight: 600;
            color: #374151;
            background: #fff;
            border: 1.5px solid #e5e7eb;
            border-radius: 10px;
            text-decoration: none;
            transition: border-color 0.15s, background 0.15s, box-shadow 0.15s, transform 0.1s;
        }
        .btn-google:hover {
            border-color: #d1d5db;
            background: #f9fafb;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
            transform: translateY(-1px);
        }
        .btn-google img { width: 22px; height: 22px; }

        /* Hint box */
        .hint-box {
            margin-top: 24px;
            padding: 14px 16px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            color: #64748b;
            line-height: 1.6;
        }
        .hint-box .hint-title {
            font-weight: 700;
            color: #334155;
            margin-bottom: 4px;
        }
        .hint-box code {
            font-family: 'Menlo', 'Consolas', monospace;
            background: #e2e8f0;
            color: #1e293b;
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 13px;
        }
    </style>
</head>
<body>
<div class="page-wrap">

    <!-- Left info panel -->
    <div class="panel-left">
        <div class="brand-mark">
            <div class="icon">
                <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
            </div>
            <span class="name">Real Time Chat</span>
        </div>

        <h2>실시간으로<br>소통하세요</h2>
        <p>공개 채널과 개인 메시지를 통해<br>누구와도 빠르게 대화할 수 있습니다.</p>

        <div class="feature-list">
            <div class="feature-item">
                <div class="dot"></div>
                <span>WebSocket 기반 실시간 메시지</span>
            </div>
            <div class="feature-item">
                <div class="dot"></div>
                <span>공개 채널 및 1:1 개인 채팅</span>
            </div>
            <div class="feature-item">
                <div class="dot"></div>
                <span>Google OAuth 또는 일반 계정 로그인</span>
            </div>
            <div class="feature-item">
                <div class="dot"></div>
                <span>MSA 기반 확장 가능한 아키텍처</span>
            </div>
        </div>
    </div>

    <!-- Right login panel -->
    <div class="panel-right">
        <div class="login-card">
            <div class="card-header">
                <span class="tag">로그인</span>
                <h1>계정에 로그인</h1>
                <p>이메일/아이디와 비밀번호를 입력하거나<br>Google 계정으로 시작하세요.</p>
            </div>

            <!-- Error -->
            <div th:if="${param.error}" class="error-box">
                이메일 또는 비밀번호가 올바르지 않습니다.
            </div>

            <!-- Local login form -->
            <form th:action="@{/login/local}" method="post">
                <div class="form-group">
                    <label for="email">이메일 / 아이디</label>
                    <input type="text" id="email" name="email"
                           placeholder="이메일 또는 아이디를 입력하세요" required>
                </div>
                <div class="form-group">
                    <label for="password">비밀번호</label>
                    <input type="password" id="password" name="password"
                           placeholder="비밀번호를 입력하세요" required>
                </div>
                <button type="submit" class="btn-primary">로그인</button>
            </form>

            <!-- Divider -->
            <div class="divider"><span>또는 소셜 계정으로</span></div>

            <!-- Google OAuth -->
            <a th:href="@{/oauth2/authorization/google}" class="btn-google">
                <img src="https://cdn1.iconfinder.com/data/icons/google-s-logo/150/Google_Icons-09-512.png" alt="Google">
                Google 계정으로 로그인
            </a>

            <!-- Hint -->
            <div class="hint-box">
                <div class="hint-title">테스트 계정</div>
                아이디 <code>test1</code> / 비밀번호 <code>123456</code>
            </div>
        </div>
    </div>

</div>
</body>
</html>
